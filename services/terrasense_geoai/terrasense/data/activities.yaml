# Activity-specific profiles for TerraSense GeoAI.
# Weights are engineering heuristics, not scientifically validated.
# Venue matchers are OSM tag filters; a candidate must match at least one matcher.

activities:
  running:
    display_name: Running or jogging
    aliases: [running, jogging, run, jog, morning run, evening run]
    venue_types: [park, recreation_ground, track, footpath, promenade]
    matchers:
      - {leisure: park}
      - {leisure: recreation_ground}
      - {leisure: track}
      - {sport: running}
      - {highway: path}
      - {highway: footway}
      - {highway: pedestrian}
    weather:
      rain_gate_mm: 2.5
      rain_gate_prob: 80
      wind_gate_kmh: 45
      heat_gate_c: 38
      heat_warn_c: 32
      cold_warn_c: 12
      uv_warn: 8
      aqi_gate: 150
      pm25_gate: 75
      prefer_daylight: false
      photography_golden_hour: false
    weights: {weather: 0.45, venue_geo: 0.30, accessibility: 0.25}
    geo_preferences:
      green_cover: prefer
      water: optional
      industry: avoid
      roads: prefer_quiet
    safety_notes:
      - Hard-gate heavy rain, extreme heat, and unhealthy AQI.
    prep_categories: [hydration, footwear, sun_protection, air_quality]
    monitor: [heat, air_quality, traffic_on_shared_paths]
    avoid_when: [heavy_rain, aqi_unhealthy, extreme_heat]

  cycling:
    display_name: Cycling for leisure or commuting
    aliases: [cycling, bike, biking, bicycle, commute by bike, cycle]
    venue_types: [cycleway, park, bicycle_route]
    matchers:
      - {highway: cycleway}
      - {cycleway: lane}
      - {cycleway: track}
      - {leisure: park}
      - {route: bicycle}
      - {amenity: bicycle_rental}
    weather:
      rain_gate_mm: 3.0
      rain_gate_prob: 80
      wind_gate_kmh: 50
      heat_gate_c: 40
      heat_warn_c: 34
      cold_warn_c: 10
      uv_warn: 8
      aqi_gate: 160
      pm25_gate: 80
      prefer_daylight: false
      photography_golden_hour: false
    weights: {weather: 0.40, venue_geo: 0.25, accessibility: 0.35}
    geo_preferences:
      green_cover: optional
      water: optional
      industry: avoid
      roads: prefer_cycle_infra
    safety_notes:
      - Prefer mapped cycleways over high-speed roads. Live traffic is not available.
    prep_categories: [lights, helmet, rain_layer, visibility]
    monitor: [wind, wet_surfaces, road_conditions]
    avoid_when: [heavy_rain, extreme_wind, aqi_unhealthy]

  golf:
    display_name: Golf
    aliases: [golf, golfing, driving range]
    venue_types: [golf_course]
    matchers:
      - {leisure: golf_course}
      - {sport: golf}
    weather:
      rain_gate_mm: 1.5
      rain_gate_prob: 70
      wind_gate_kmh: 40
      heat_gate_c: 40
      heat_warn_c: 34
      cold_warn_c: 12
      uv_warn: 8
      aqi_gate: 150
      pm25_gate: 75
      prefer_daylight: true
      photography_golden_hour: false
    weights: {weather: 0.45, venue_geo: 0.40, accessibility: 0.15}
    geo_preferences:
      green_cover: prefer
      water: optional
      industry: avoid
      roads: optional
    safety_notes:
      - Lightning and heavy rain hard-gate play. Mapped OSM golf courses only.
    prep_categories: [sun_protection, hydration, rain_layer]
    monitor: [lightning_risk, wind, uv]
    avoid_when: [rain, thunderstorm, extreme_wind]

  cricket:
    display_name: Recreational cricket or practice
    aliases: [cricket, cricket practice, nets, gully cricket]
    venue_types: [cricket_pitch, recreation_ground, park]
    matchers:
      - {sport: cricket}
      - {leisure: pitch}
      - {leisure: recreation_ground}
      - {leisure: park}
    weather:
      rain_gate_mm: 1.0
      rain_gate_prob: 70
      wind_gate_kmh: 45
      heat_gate_c: 40
      heat_warn_c: 35
      cold_warn_c: 14
      uv_warn: 9
      aqi_gate: 150
      pm25_gate: 75
