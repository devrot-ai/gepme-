[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrasense"]

[project]
name = "terrasense-geoai"
version = "0.1.0"
description = "TerraSense GeoAI — place-and-time outdoor activity assistant for the CSRE GeoAI Hackathon"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.6,<4.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.1,<26.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = [
    "torch>=2.2,<3.0",
    "transformers>=4.43,<5.0",
    "accelerate>=0.33,<2.0",
    "safetensors>=0.4,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "respx>=0.21,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
